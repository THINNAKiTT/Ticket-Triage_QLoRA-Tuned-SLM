[project]
name = "slm-qlora-finetune"
version = "0.1.0"
description = "QLoRA fine-tuning of Qwen2.5-0.5B for bilingual (English/Roman-Urdu) support-ticket triage and entity extraction"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.16.0",
    "bitsandbytes>=0.50.2",
    "datasets>=5.2.0",
    "matplotlib>=3.11.2",
    "peft>=0.22.0",
    "pydantic>=2.14.4",
    "scikit-learn>=1.9.1",
    "torch==2.13.0",
    "transformers>=5.23.0",
    "trl>=1.18.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
